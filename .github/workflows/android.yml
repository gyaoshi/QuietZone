name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================
  # 桌面端单元测试: 直接编译纯 C++ 内核 (不依赖 Oboe / Android)
  # 这是唯一能在 CI 上验证"降噪算法真的收敛"的环节
  # ============================================================
  dsp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile DSP core + unit tests
        run: |
          g++ -std=c++17 -O2 -Wall -I app/src/main/cpp \
            tests/anc_unit_test.cpp \
            app/src/main/cpp/anc_core.cpp \
            app/src/main/cpp/audio_processor.cpp \
            app/src/main/cpp/spectrum_analyzer.cpp \
            -o anc_unit_test

      - name: Run unit tests
        run: ./anc_unit_test

  # ============================================================
  # Android APK 构建
  # ============================================================
  build:
    runs-on: ubuntu-latest
    needs: dsp-test

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Publish to fixed 'latest' release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release view latest >/dev/null 2>&1 || \
          gh release create latest --title "QuietZone latest" --notes "自动构建产物" || true
        gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
        gh release upload latest app/build/outputs/apk/release/app-release-unsigned.apk --clobber
